<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Sistema de Reserva</title>
</head>
<body>
    <header>

        <div class="titulo-header">
            <h2 class="h2-header">
                <img src="./src/monitor.png" alt="" class="img-monitor">
                SISTEMA DE RESERVA DE CARRINHOS
            </h2>
            <p class="p">cada carrinho possui 40 computadores</p>
        </div>

    </header>


    <main>

        <div class="container-principal">

            <div class="mensagem-bem-vindo">
                <h2>BEM VINDO DE VOLTA <br>
                    <span>PROFESSOR(A)!</span>
                </h2>

                <div class="numero-maquinas">
                    <h1>10</h1>
                    <h3>Aparelhos disponíveis</h3>
                </div>

            </div>

        </div>

<!--PARTE DOIS-->


        <h2 class="titulo-grade">
            GRADE SEMANAL
        </h2>


    <div class="grade-semanal">

        <div class="week-grid">

                <div class="day-card">
                    <span class="day-name">Segunda</span>
                    <span class="day-number">07</span>
                </div>

                <div class="day-card">
                    <span class="day-name">Terça</span>
                    <span class="day-number">08</span>
                </div>

                <div class="day-card">
                    <span class="day-name">Quarta</span>
                    <span class="day-number">09</span>
                </div>

                <div class="day-card">
                    <span class="day-name">Quinta</span>
                    <span class="day-number">10</span>
                </div>

                <div class="day-card">
                    <span class="day-name">Sexta</span>
                    <span class="day-number">11</span>
                </div>

                <div class="day-card weekend">
                    <span class="day-name">Sábado</span>
                    <span class="day-number">12</span>
                </div>

                <div class="day-card weekend">
                    <span class="day-name">Domingo</span>
                    <span class="day-number">13</span>
                </div>
                
        </div>

            
    </div>


        <div class="parte-dois">

            <ul class="lista-info'">
                <li>
                    <div class="data-label">
                        <label>DATA</label>
                        <input type="date">
                    </div>
                </li>    

                <li>
                    <div class="horario-label">
                        <label>HORÁRIO</label>
                        <input type="time">
                    </div>
                </li>
                
            </ul>

        </div>   
            


        </div>
    </main>


</body>
</html>
